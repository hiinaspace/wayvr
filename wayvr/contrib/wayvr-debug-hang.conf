[Service]
# Keep a wedged teardown alive for inspection. This later-sorting drop-in
# overrides the normal vr-session stop helper and its SIGKILL fallback.
ExecStop=
TimeoutStopSec=infinity
SendSIGKILL=no

# The Vulkan loader's no-unload A/B still reproduced the same NVIDIA GLX
# process-exit spin. Override any previously activated test setting.
UnsetEnvironment=VK_LOADER_DISABLE_DYNAMIC_LIBRARY_UNLOADING
